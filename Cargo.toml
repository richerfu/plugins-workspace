[workspace]
members = [
  "plugins/*",
  "plugins/*/tests/*",
  "plugins/updater/tests/updater-migration/v2-app",
  "plugins/*/examples/*/src-tauri",
  "examples/*/src-tauri",
]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
log = "0.4.21"
tauri = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony", default-features = false }
tauri-build = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony" }
tauri-plugin = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony" }
tauri-utils = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony" }
serde_json = "1"
thiserror = "2"
url = "2"
schemars = "0.8"
dunce = "1"
specta = "^2.0.0-rc.16"
glob = "0.3"
zbus = "5.9"
openharmony-ability-plugin-accessibility = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-account = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-autostart = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-clipboard = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-continuation = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-deep-link = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-files = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-global-shortcut = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-screenshot = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-updater = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-url = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }
openharmony-ability-plugin-window = { git = "https://github.com/harmony-contrib/openharmony-ability", branch = "codex/complete-platform-capabilities" }

[workspace.package]
edition = "2024"
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
rust-version = "1.90"
repository = "https://github.com/tauri-apps/plugins-workspace"

# default to small, optimized release binaries
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"

[patch.crates-io]
tauri = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony" }
tauri-build = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony" }
tauri-utils = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony" }
tauri-runtime = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony" }
tauri-runtime-wry = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony" }
tauri-plugin = { git = "https://github.com/richerfu/tauri", branch = "feat-openharmony" }
