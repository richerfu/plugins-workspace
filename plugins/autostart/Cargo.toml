[package]
name = "tauri-plugin-autostart"
version = "2.7.0"
description = "Automatically launch your application at startup."
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-autostart"
exclude = [
  "/banner.png",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/tsconfig.json",
]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "none", notes = "" }
ios = { level = "none", notes = "" }
openharmony = { level = "partial", notes = "enable/disable navigate to system settings; isEnabled requires API 21+" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_env = "ohos"))'.dependencies]
auto-launch = "0.6"

[target.'cfg(target_env = "ohos")'.dependencies]
openharmony-ability-plugin-autostart = { workspace = true }
log = { workspace = true }
