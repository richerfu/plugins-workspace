[package]
name = "tauri-plugin-notification"
version = "2.8.1"
description = "Send desktop and mobile notifications on your Tauri application."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-notification"
exclude = [
  "/banner.png",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/test",
  "/tsconfig.json",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "Only works for installed apps. Shows powershell name & icon in development." }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }
openharmony = { level = "partial", notes = "Text/long/multiline notifications, permissions, channels (emulated over 4 system slot types), active() via getActiveNotifications, action buttons with actionPerformed click events (buttons are text-only; requires EntryAbility wiring from tauri-cli open-harmony template). Scheduling publishes reminderAgentManager system reminders (at, interval, every day/week/month/year) and requires the AGC agent-reminder entitlement and PUBLISH_AGENT_REMINDER permission." }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
tauri = { workspace = true, features = ["wry"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
rand = "0.10"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
url = { version = "2", features = ["serde"] }
serde_repr = "0.1"

[target.'cfg(any(target_os = "ios", target_env = "ohos"))'.dependencies]
tauri = { workspace = true, features = ["wry"] }

[target."cfg(all(any(target_os = \"macos\", windows, target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"), not(target_env = \"ohos\")))".dependencies]
notify-rust = "4.18"

[target."cfg(all(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"), not(target_env = \"ohos\")))".dependencies]
zbus = "5"

[features]
# Deprecated: tauri 2.12 no longer supports Windows 7, so this feature does nothing.
windows7-compat = []
# Kept so the implicit features of the removed optional dependencies still resolve.
win7-notifications = []
windows-version = []
