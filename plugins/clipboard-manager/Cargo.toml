[package]
name = "tauri-plugin-clipboard-manager"
version = "2.5.0"
description = "Read and write to the system clipboard."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-clipboard-manager"
exclude = [
  "/banner.png",
  "/guest-js",
  "/package.json",
  "/rollup.config.js",
  "/tsconfig.json",
]

[package.metadata.docs.rs]

targets = ["x86_64-unknown-linux-gnu", "x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "partial", notes = "Only plain-text content support" }
ios = { level = "partial", notes = "Only plain-text content support" }
openharmony = { level = "partial", notes = "All methods supported via openharmony-ability-plugin-clipboard; read_text/read_image require READ_PASTEBOARD permission; write_secret delegates to write_text" }


[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { workspace = true, features = ["wry"] }

[target."cfg(all(any(target_os = \"macos\", windows, target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"), not(target_env = \"ohos\")))".dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }

[target.'cfg(target_env = "ohos")'.dependencies]
openharmony-ability-plugin-clipboard = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
